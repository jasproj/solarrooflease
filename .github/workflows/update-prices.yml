name: Update Chicken Prices

on:
  schedule:
    - cron: '0 22 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Fetch prices
        env:
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: python fetch_prices.py

      - name: Commit changes
        run: |
          git config user.email "bot@github.com"
          git config user.name "github-actions"
          git add prices.json
          git diff --staged --quiet || git commit -m "Update prices"
          git pull --rebase
          git push
